    "starlette>=1.3.1",
    # Dependabot #80 (NestedSecretsSettingsSource symlink escape)
    "pydantic-settings>=2.14.2",
    # Dependabot #97 (MANIFEST.in exclusion bypass via Unicode normalization)
    # Dependabot #247 (Windows path escape via namespace_packages.txt)
    "setuptools>=84.1.0",
    # Dependabot #127-#130, #137 (sqlparse ReDoS / quadratic DoS / snippet breakout)
    "sqlparse>=0.6.0",
    # Dependabot #175 / CVE-2026-104851 (SSTI RCE in ReferenceFileSystem)
    "fsspec>=2026.6.0",
    # Dependabot #176 / CVE-2026-104874 (items-view reference leak).
    # Cap below 7: the advisory is patched in 6.9.1; 7.x is an unrelated major.
    "multidict>=6.9.1,<7",
    # Dependabot #178 / CVE-2026-102598 (safe_join Windows device-name hang)
    "werkzeug>=3.1.9",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"
