    "opentelemetry-api>=1.45.2",
    # Dependabot #261 (emSign roots with compromised intermediate keys).
    "certifi>=2026.10.18",
    # Dependabot #250, #259-#260 (ReadWriteLock / SoftFileLock on shared hosts).
    # Transitive via pre-commit -> virtualenv (dev extra only).
    "filelock>=4.2.1",
    # Dependabot #145 / CVE-2026-63374 (TLS cert spoof via IDNA 2003 encoding)
    # and #144 (process-pool stderr hang). Transitive via httpx/starlette.
    "anyio>=4.14.2",
    # CVE-2026-44843 (unsafe deserialization via overly broad load() allowlists)
    "langchain-core>=1.3.3",
    # CVE-2026-21441 / CVE-2026-44431 plus Dependabot #157-#159 (proxy TLS,
    # unbounded chunk buffer, Deflate loop). Floor 2.8.0.
    "urllib3>=2.8.0",
    # Dependabot #79 (LangSmith TracingMiddleware arbitrary server-side file read).
    # Transitive via mlflow-tracing -> mlflow; restating the floor here lets
    # the override propagate when downstream pyproject.toml mirrors this block.
    "langsmith>=0.8.18",
    # Dependabot #84-#96 (heap OOB / decompression-bomb / DoS in image codecs)
    # GHSA-8g5g-8vmr-9782 plus 12.3.x follow-ons. Floor 13.0.0.
    "pillow>=13.0.0",
    # Dependabot #98-#99 (OID / REAL DoS)
    # Dependabot #263-#266 (quadratic BER/CER/DER, REAL, BIT STRING decoding)
    "pyasn1>=0.6.5",
    # Dependabot #73 (vulnerable OpenSSL bundled in cryptography wheels)
    # Dependabot #115 / CVE-2026-69247 (PKCS#7 EnvelopedData Bleichenbacher oracle)
    "cryptography>=50.0.0",
    # Dependabot #54-#58, #146-#156, #160, #162 (JWK/JWT forgery, PEM/HMAC
    # confusion, JWKS SSRF/DoS). Floor 2.15.0: 2.14.0 still has #160.
    "pyjwt>=2.15.0",
    # Dependabot #163-#164, #173-#174 (activator command injection, seed-wheel
    # integrity) and #262 (unescaped --prompt in the bash activator PS1).
    # Transitive via pre-commit (dev extra only).
    # GHSA-vxj4-q4g9-crj7 / GHSA-5vjq-rrrf-7h2q / GHSA-c947-3pg5-gm8q /
    # GHSA-8rjx-v5ww-45pp. Floor 21.14.13.
    "virtualenv>=21.14.13",
    # Dependabot #51-#52, #64-#72 (CRLF / cookie / redirect / parser issues)
    # Dependabot #114 / CVE-2026-69244 (C HTTP parser heap OOB on malformed chunked)
    # Dependabot #180-#182 (shared-cookie Secure, no header timeout, memory/CPU DoS)
    "aiohttp>=3.14.4",
    # Dependabot #53, #74-#77 (Host validation, SSRF, form-limit DoS).
    # FastAPI 0.136 declares starlette>=0.46.0 with no upper bound, so 1.3.x
