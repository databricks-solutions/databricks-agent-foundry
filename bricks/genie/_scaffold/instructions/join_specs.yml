# Join Specifications
# ===================
# Pre-defined join relationships between tables. Genie uses these
# to correctly join tables when answering multi-table questions.
#
# IDs are auto-generated by assemble.py.
#
# IMPORTANT -- alias matching:
#   The "alias" field must match either:
#     a) the table's last segment (e.g., "orders" for catalog.schema.orders), or
#     b) an explicit alias you set in tables.yml.
#   The assembler auto-backtick-quotes column references in the sql field,
#   so write plain SQL here: orders.customer_id = customers.customer_id
#   It will become `orders`.`customer_id` = `customers`.`customer_id` in the API.
#
# Relationship types: many_to_one | one_to_many | one_to_one
#   Defaults to many_to_one if omitted.

join_specs:
  - left:
      identifier: "system.information_schema.tables"
      alias: "tables"
    right:
      identifier: "system.information_schema.columns"
      alias: "columns"
    sql: "tables.table_catalog = columns.table_catalog AND tables.table_schema = columns.table_schema AND tables.table_name = columns.table_name"
    relationship_type: "one_to_many"
    comment: "Join tables to columns on the full three-part key"
    instruction: "Use this join when you need both table metadata and column details"
