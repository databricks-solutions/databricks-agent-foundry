# SQL Snippets
# ============
# Reusable SQL fragments that Genie composes into queries.
# Three types: filters, expressions, and measures.
#
# IDs are auto-generated by assemble.py.
#
# IMPORTANT -- column references:
#   Use the table alias from tables.yml (the table's last segment),
#   NOT short aliases like "o" or "c". The API validates that the alias
#   exists in your data_sources. For example:
#     GOOD: orders.order_amount, customers.region
#     BAD:  o.order_amount, c.region
#
#   If a column is unambiguous across tables, you can omit the alias,
#   but it's safer to always qualify.

filters: []
expressions: []
measures:
  - alias: "table_count"
    sql: "COUNT(DISTINCT `tables`.`table_name`)"
    display_name: "table count"
    synonyms: ["number of tables", "total tables"]
