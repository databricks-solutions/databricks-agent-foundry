# Benchmark Questions
# ===================
# Ground-truth Q&A pairs for validating Genie Space accuracy.
# Each question needs exactly one SQL answer.
# The benchmark runner sends each question to the Genie conversation API
# and compares the generated SQL against your expected answer.
#
# Guidelines:
#   - Aim for 20-50 questions covering your common query patterns
#   - Keep queries scoped with WHERE filters so they execute quickly
#   - Cover different patterns: aggregation, filtering, joins, top-N
#   - Match the table/column names from tables.yml exactly
#   - IDs are auto-generated by assemble.py
#
# Run benchmarks:
#   pytest tests/ --run-live -k test_benchmarks -v

questions:
  - question: "How many tables are in system.information_schema?"
    sql: |
      SELECT COUNT(DISTINCT table_name) AS table_count
      FROM system.information_schema.tables
      WHERE table_catalog = 'system'
        AND table_schema = 'information_schema'

  - question: "What data types are used in system.information_schema.tables?"
    sql: |
      SELECT data_type, COUNT(*) AS column_count
      FROM system.information_schema.columns
      WHERE table_catalog = 'system'
        AND table_schema = 'information_schema'
        AND table_name = 'tables'
      GROUP BY data_type
      ORDER BY column_count DESC
