# Metric View Definitions (Optional)
# ===================================
# Metric views are pre-aggregated tables registered in Unity Catalog
# that enforce consistent KPI definitions. Genie treats them like
# regular tables but they typically have fewer columns and faster
# query times due to pre-aggregation.
#
# Use metric views when you need strict KPI consistency across users.
# For ad-hoc exploration, regular tables with sql_snippets are often
# sufficient.
#
# Same column_config options as tables.yml apply here.

