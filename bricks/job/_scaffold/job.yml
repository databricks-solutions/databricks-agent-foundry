# yaml-language-server: $schema=../../../../.agent-foundry/schemas/job_config.schema.json
#
# Databricks Job — full configuration reference
# ===============================================
# This scaffold is the discoverability surface for the Jobs brick. Every
# top-level JobConfig field appears below (active or commented). Uncomment
# and adapt sections you need; leave unused knobs commented so the next
# author still sees them.
#
# Relative notebook, Spark Python and SQL file paths starting with ./ are
# uploaded to /Shared/agent-foundry/<target>/<app>/jobs/<job>/, keeping the
# folder they sit in locally. This includes the task nested inside a
# for_each_task. Absolute /Workspace/... or /Shared/... paths are passed
# through unchanged. Only ./notebooks/example_notebook.py ships with this
# scaffold: create the file before uncommenting a task that points at one
# of the others, or deploy fails with "Task source not found".
#
# Docs: https://docs.databricks.com/aws/en/jobs/
# API:  jobs.create / jobs.reset (JobSettings)
# Job names include target_name so a second target does not adopt the first.

name: "${var.target_name}-${var.app_name}-example-job"
description: "Example multi-option job managed by Agent Foundry"

# ---------------------------------------------------------------------------
# Tasks (multi-task DAG)
# ---------------------------------------------------------------------------
# Each task must declare exactly one task type. Use depends_on + run_if to
# build a DAG. Compute options (pick at most one per task):
#   - omit all → serverless default for notebook / SQL warehouse tasks
#   - environment_key → serverless environment from `environments:`
#   - job_cluster_key → shared classic cluster from `job_clusters:`
#   - existing_cluster_id → reuse an all-purpose cluster
#   - new_cluster → task-scoped classic cluster

tasks:
  - task_key: notebook
    description: "Run the example notebook"
    notebook_task:
      notebook_path: ./notebooks/example_notebook.py
      # source: WORKSPACE          # WORKSPACE (default) or GIT
      # warehouse_id: "${var.warehouse_id}"  # optional SQL warehouse for SQL cells
      base_parameters:
        catalog: "${var.catalog}"
    # job_cluster_key: shared_job_cluster
    # existing_cluster_id: "0123-456789-abcd012"
    # new_cluster:
    #   spark_version: "15.4.x-scala2.12"
    #   node_type_id: "i3.xlarge"
    #   num_workers: 2
    #   spark_conf:
    #     spark.databricks.cluster.profile: singleNode
    #   custom_tags:
    #     ResourceClass: SingleNode
    # libraries:
    #   - pypi:
    #       package: "pandas==2.2.2"
    #   - whl: "/Volumes/${var.catalog}/${var.schema}/libs/mylib.whl"
    timeout_seconds: 0
    max_retries: 0
    # min_retry_interval_millis: 300000
    # retry_on_timeout: false
    # run_if: ALL_SUCCESS
    # disabled: false
    # email_notifications:
    #   on_failure: ["oncall@example.com"]
