# ---------------------------------------------------------------------------
# Serverless environments (referenced by environment_key)
# ---------------------------------------------------------------------------
environments:
  - environment_key: default
    spec:
      client: "1"
      dependencies: []
      # environment_version: "2"
      # java_dependencies: []

# ---------------------------------------------------------------------------
# Job-level parameters ({{job.parameters.<name>}} in task configs)
# ---------------------------------------------------------------------------
parameters: []
# parameters:
#   - name: catalog
#     default: "${var.catalog}"
#   - name: run_date
#     default: ""

# ---------------------------------------------------------------------------
# Tags (ai_solution_managed_by is injected automatically on deploy)
# ---------------------------------------------------------------------------
tags:
  purpose: example

# ---------------------------------------------------------------------------
# Run mode — pick at most ONE of: trigger | schedule | continuous
# ---------------------------------------------------------------------------

# File arrival (UC Volume / cloud storage path)
trigger:
  file_arrival:
    url: "/Volumes/${var.catalog}/${var.schema_prefix}_indexes/docs_sources/"
    min_time_between_triggers_seconds: 60
    wait_after_last_change_seconds: 61
  pause_status: PAUSED

# Periodic interval:
# trigger:
#   periodic:
#     interval: 1
#     unit: HOURS          # HOURS | DAYS | WEEKS
#   pause_status: UNPAUSED

# Table update:
# trigger:
#   table_update:
#     table_names:
#       - "${var.catalog}.${var.schema_prefix}_indexes.docs"
#     condition: ANY_UPDATED   # ANY_UPDATED | ALL_UPDATED (required for 2+ tables)
#     min_time_between_triggers_seconds: 300
#     wait_after_last_change_seconds: 60
#   pause_status: UNPAUSED

# Cron schedule (Quartz):
# schedule:
#   quartz_cron_expression: "0 0 8 * * ?"   # daily 08:00
#   timezone_id: UTC                        # e.g. Europe/Berlin
#   pause_status: UNPAUSED

# Continuous (always-on streaming-style):
# continuous:
#   pause_status: UNPAUSED

# ---------------------------------------------------------------------------
# Concurrency, queue, timeout
# ---------------------------------------------------------------------------
max_concurrent_runs: 1
timeout_seconds: 0
# queue:
#   enabled: true

