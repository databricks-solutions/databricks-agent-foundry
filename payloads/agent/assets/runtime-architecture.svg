<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 720" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1700" height="720" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- ===== Process start ===== -->
  <rect x="20" y="20" width="1660" height="75" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="35" y="40" font-size="12.5" font-weight="600" fill="#1f2328">Process start &#183; once per App process</text>
  <rect x="300" y="32" width="360" height="52" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="480" y="53" text-anchor="middle" font-size="12" fill="#1f2328">setup_tracing_early()</text>
  <text x="480" y="70" text-anchor="middle" font-size="10" fill="#57606a">tracing.py &#183; MLflow experiment + UC OTel destination</text>
  <rect x="690" y="32" width="420" height="52" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="900" y="53" text-anchor="middle" font-size="12" fill="#1f2328">init_agent_module()</text>
  <text x="900" y="70" text-anchor="middle" font-size="10" fill="#57606a">core.py &#183; PromptCachedDatabricksOpenAI as default client &#183; OpenAI autolog</text>
  <rect x="1140" y="32" width="520" height="52" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="1400" y="53" text-anchor="middle" font-size="12" fill="#1f2328">Deploy-time inputs (read on first request)</text>
  <text x="1400" y="70" text-anchor="middle" font-size="10" fill="#57606a">payload.yml spec.runtime &#183; assembled skills &#8594; SYSTEM_PROMPT &#183; mcp _state/&lt;target&gt;.json</text>

  <!-- ===== Entry points ===== -->
  <rect x="20" y="165" width="180" height="60" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="110" y="190" text-anchor="middle" font-size="12" fill="#1f2328">/invocations</text>
  <text x="110" y="206" text-anchor="middle" font-size="10" fill="#57606a">@invoke / @stream &#183; source: ui</text>
  <rect x="20" y="255" width="180" height="60" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="110" y="280" text-anchor="middle" font-size="12" fill="#1f2328">/api/mcp &#183; /api/a2a</text>
  <text x="110" y="296" text-anchor="middle" font-size="10" fill="#57606a">agent_runner &#183; source: mcp / a2a</text>
  <text x="110" y="330" text-anchor="middle" font-size="9.5" fill="#57606a">single question &#183; skips step 3 + hooks</text>

  <!-- ===== Per request ===== -->
  <rect x="230" y="115" width="1450" height="235" rx="8" fill="#eef8f0" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="245" y="136" font-size="12.5" font-weight="600" fill="#1f2328">Per request &#183; agent.py</text>

  <g font-size="10.5" fill="#1f2328">
    <!-- 1 Setup -->
    <rect x="250" y="150" width="215" height="180" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
    <text x="262" y="172" font-size="12" font-weight="600">1 &#183; Setup</text>
    <text x="262" y="188" font-size="10" fill="#57606a">_prepare_request_setup</text>
    <text x="262" y="212" fill="#9a6700">&#8226; config + variables (cached)</text>
    <text x="262" y="232">&#8226; tag trace: source, prompt</text>
    <text x="262" y="252">&#8226; in-process tools: Python</text>
    <text x="272" y="267">tools, _load_skill (lazy)</text>
    <text x="262" y="287">&#8226; sanitize history (unique</text>
    <text x="272" y="302">call IDs, drop orphans)</text>

    <!-- 2 MCP connect -->
    <rect x="489" y="150" width="215" height="180" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
    <text x="501" y="172" font-size="12" font-weight="600">2 &#183; MCP connect</text>
    <text x="501" y="188" font-size="10" fill="#57606a">_managed_mcp_servers</text>
    <text x="501" y="212" fill="#9a6700">&#8226; server specs from _state (cached)</text>
    <text x="501" y="232">&#8226; wrappers rebuilt per request</text>
    <text x="511" y="247">with the user's OBO token</text>
    <text x="511" y="262">(service principal fallback)</text>
    <text x="501" y="282">&#8226; connect in parallel,</text>
    <text x="511" y="297">drop servers that fail</text>

    <!-- 3 MCP prompts / resources -->
    <rect x="728" y="150" width="215" height="180" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
    <text x="740" y="172" font-size="12" font-weight="600">3 &#183; MCP prompts &amp; resources</text>
    <text x="740" y="188" font-size="10" fill="#57606a">_build_consumption_layer</text>
    <text x="740" y="212">&#8226; tool manuals from MCP</text>
    <text x="750" y="227">prompts (per-conversation</text>
    <text x="750" y="242">cache)</text>
    <text x="740" y="262">&#8226; one &lt;prefix&gt;read_resource</text>
    <text x="750" y="277">tool per server with</text>
    <text x="750" y="292">resources enabled</text>

    <!-- 4 Data universe -->
    <rect x="967" y="150" width="215" height="180" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
    <text x="979" y="172" font-size="12" font-weight="600">4 &#183; Data universe</text>
    <text x="979" y="188" font-size="10" fill="#57606a">ensure_data_universe</text>
    <text x="979" y="212">&#8226; get_data_landscape() via SQL</text>
    <text x="979" y="232" fill="#9a6700">&#8226; TTL cache per process;</text>
    <text x="989" y="247" fill="#9a6700">stale block served while</text>
    <text x="989" y="262" fill="#9a6700">one request refreshes</text>
    <text x="979" y="282">&#8226; rendered as a Markdown</text>
    <text x="989" y="297">block for the prompt</text>

    <!-- 5 create_agent: prompt stack -->
    <rect x="1206" y="150" width="215" height="180" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
    <text x="1218" y="172" font-size="12" font-weight="600">5 &#183; create_agent</text>
    <text x="1218" y="188" font-size="10" fill="#57606a">core.py &#183; prompt in fixed order</text>
    <rect x="1218" y="198" width="191" height="20" rx="3" fill="#d2f4dd" stroke="#1a7f37" stroke-width="0.8"/>
    <text x="1313" y="212" text-anchor="middle" font-size="10">SYSTEM_PROMPT (+ skills)</text>
    <rect x="1218" y="221" width="191" height="20" rx="3" fill="#d2f4dd" stroke="#1a7f37" stroke-width="0.8"/>
    <text x="1313" y="235" text-anchor="middle" font-size="10">tool manuals</text>
    <rect x="1218" y="244" width="191" height="20" rx="3" fill="#d2f4dd" stroke="#1a7f37" stroke-width="0.8"/>
    <text x="1313" y="258" text-anchor="middle" font-size="10">data universe</text>
    <line x1="1218" y1="273" x2="1409" y2="273" stroke="#9a6700" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="1313" y="285" text-anchor="middle" font-size="9.5" fill="#9a6700">prompt-cache breakpoint</text>
    <rect x="1218" y="292" width="191" height="20" rx="3" fill="#ffffff" stroke="#57606a" stroke-width="0.8"/>
    <text x="1313" y="306" text-anchor="middle" font-size="10">identity (user &#183; date)</text>
    <text x="1313" y="324" text-anchor="middle" font-size="9.5" fill="#57606a">identity last &#8594; all users share the cache</text>

    <!-- 6 Run -->
    <rect x="1445" y="150" width="215" height="180" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
    <text x="1457" y="172" font-size="12" font-weight="600">6 &#183; Run</text>
    <text x="1457" y="188" font-size="10" fill="#57606a">_run_invoke / _run_stream</text>
    <text x="1457" y="212">&#8226; reset hook (seeds state)</text>
    <text x="1457" y="232" font-weight="600">&#8226; agent loop (below)</text>
    <text x="1457" y="252">&#8226; finalize hook &#8594;</text>
    <text x="1467" y="267">custom_outputs</text>
    <text x="1457" y="287">&#8226; context window exceeded</text>
    <text x="1467" y="302">&#8594; fail-soft notice</text>
  </g>

  <!-- ===== Agent loop and lanes ===== -->
  <rect x="250" y="410" width="170" height="240" rx="6" fill="#d2f4dd" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="335" y="515" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Agent loop</text>
  <text x="335" y="533" text-anchor="middle" font-size="10" fill="#57606a">OpenAI Agents SDK Runner</text>
  <text x="335" y="548" text-anchor="middle" font-size="10" fill="#57606a">up to max_iterations turns</text>

  <rect x="450" y="410" width="970" height="110" rx="8" fill="#f0f4fb" stroke="#7a93c0" stroke-width="1.5"/>
  <text x="1405" y="430" text-anchor="end" font-size="12.5" font-weight="600" fill="#1f2328">Model call</text>
  <rect x="470" y="440" width="290" height="62" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="615" y="461" text-anchor="middle" font-size="12" fill="#1f2328">Tool-result clearing</text>
  <text x="615" y="477" text-anchor="middle" font-size="10" fill="#57606a">tool_result_clearing.py &#183; call_model_input_filter</text>
  <text x="615" y="491" text-anchor="middle" font-size="10" fill="#57606a">replaces older tool outputs with a placeholder</text>
  <rect x="790" y="440" width="350" height="62" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="965" y="461" text-anchor="middle" font-size="12" fill="#1f2328">PromptCachedDatabricksOpenAI</text>
  <text x="965" y="477" text-anchor="middle" font-size="10" fill="#57606a">prompt_cache.py &#183; cache_control on the stable prefix</text>
  <text x="965" y="491" text-anchor="middle" font-size="10" fill="#57606a">reasoning.py &#183; replay + normalize thinking blocks</text>
  <rect x="1170" y="440" width="230" height="62" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="1285" y="461" text-anchor="middle" font-size="12" fill="#1f2328">Model Serving</text>
  <text x="1285" y="477" text-anchor="middle" font-size="10" fill="#57606a">spec.runtime.model</text>
  <text x="1285" y="491" text-anchor="middle" font-size="10" fill="#57606a">extra_body &#183; thinking &#183; effort</text>

  <rect x="450" y="540" width="970" height="110" rx="8" fill="#f6f0ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="1405" y="560" text-anchor="end" font-size="12.5" font-weight="600" fill="#1f2328">Tool call</text>
  <rect x="470" y="553" width="270" height="48" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="605" y="573" text-anchor="middle" font-size="12" fill="#1f2328">In-process tools</text>
  <text x="605" y="589" text-anchor="middle" font-size="10" fill="#57606a">Python tools &#183; _load_skill &#183; &lt;prefix&gt;read_resource</text>
  <rect x="790" y="570" width="350" height="70" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="965" y="591" text-anchor="middle" font-size="12" fill="#1f2328">FilteredMCPServerStreamableHttp</text>
  <text x="965" y="607" text-anchor="middle" font-size="10" fill="#57606a">mcp_wrapper.py &#183; allowlist, glob, alias, name prefix</text>
  <text x="965" y="621" text-anchor="middle" font-size="10" fill="#57606a">auto-poll submit &#8594; poll &#183; SQL result compacting &#183; _meta</text>
  <rect x="1170" y="580" width="230" height="50" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="1285" y="601" text-anchor="middle" font-size="12" fill="#1f2328">MCP servers</text>
  <text x="1285" y="617" text-anchor="middle" font-size="10" fill="#57606a">managed &#183; external &#183; custom_app</text>

  <!-- ===== Legend ===== -->
  <rect x="1445" y="410" width="215" height="240" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
  <text x="1460" y="432" font-size="12.5" font-weight="600" fill="#1f2328">Legend</text>
  <text x="1460" y="456" font-size="10.5" fill="#9a6700">amber = cached per process</text>
  <text x="1460" y="474" font-size="10.5" fill="#1f2328">black = built per request</text>
  <text x="1460" y="504" font-size="10.5" font-weight="600" fill="#1f2328">Response</text>
  <text x="1460" y="522" font-size="10.5" fill="#1f2328">invoke: one response</text>
  <text x="1460" y="538" font-size="10.5" fill="#1f2328">stream: events + trailing</text>
  <text x="1460" y="554" font-size="10.5" fill="#1f2328">custom_outputs event</text>
  <text x="1460" y="584" font-size="10.5" font-weight="600" fill="#1f2328">Tracing</text>
  <text x="1460" y="602" font-size="10.5" fill="#1f2328">every step is an MLflow span,</text>
  <text x="1460" y="618" font-size="10.5" fill="#1f2328">exported to the UC OTel</text>
  <text x="1460" y="634" font-size="10.5" fill="#1f2328">tables</text>

  <!-- ===== Connectors ===== -->
  <g fill="none" stroke="#57606a" stroke-width="1.4">
    <path d="M200,195 H248" marker-end="url(#arrow)"/>
    <path d="M200,285 H248" marker-end="url(#arrow)"/>
    <path d="M465,240 H487" marker-end="url(#arrow)"/>
    <path d="M704,240 H726" marker-end="url(#arrow)"/>
    <path d="M943,240 H965" marker-end="url(#arrow)"/>
    <path d="M1182,240 H1204" marker-end="url(#arrow)"/>
    <path d="M1421,240 H1443" marker-end="url(#arrow)"/>
    <path d="M1552,330 V375 H335 V408" marker-end="url(#arrow)"/>
    <path d="M420,471 H468" marker-end="url(#arrow)"/>
    <path d="M760,471 H788" marker-end="url(#arrow)"/>
    <path d="M1140,471 H1168" marker-end="url(#arrow)"/>
    <path d="M420,577 H468" marker-end="url(#arrow)"/>
    <path d="M420,630 H788" marker-end="url(#arrow)"/>
    <path d="M1140,605 H1168" marker-end="url(#arrow)"/>
  </g>
  <text x="560" y="625" text-anchor="middle" font-size="10" fill="#57606a">MCP tool call</text>
  <text x="940" y="392" text-anchor="middle" font-size="10" fill="#57606a">Runner.run / run_streamed</text>
</svg>
