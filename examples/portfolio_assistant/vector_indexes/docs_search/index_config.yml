# yaml-language-server: $schema=../../../../.agent-foundry/schemas/vector_search_index_config.schema.json
#
# Vector Search Index: docs_search
# ==================================
# Delta Sync index on the docs_chunks table that jobs/docs_ingest fills.
# Databricks manages embeddings via Foundation Model API, computed from
# chunk_to_embed (chunk text plus document and page context).

# The agent reaches this index through mcp_servers/docs_search/.

endpoint:
  name: "${var.vs_endpoint_name}"
  endpoint_type: "STANDARD"

index:
  name: "${var.catalog}.${var.schema_prefix}_indexes.docs_chunks_index"
  primary_key: "chunk_id"
  index_type: "DELTA_SYNC"

  delta_sync:
    source_table: "${var.catalog}.${var.schema_prefix}_indexes.docs_chunks"
    pipeline_type: "TRIGGERED"
    columns_to_sync:
      - "chunk_id"
      - "content"
      - "source"
      - "category"
      - "doc_uri"
      - "page_number"
    embedding_source_columns:
      - name: "chunk_to_embed"
        embedding_model_endpoint_name: "databricks-gte-large-en"
