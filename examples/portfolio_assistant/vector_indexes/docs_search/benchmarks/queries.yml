# Benchmark queries for the docs_search index.
# After deployment and sync, these queries validate retrieval quality.

queries:
  - question: "What is Unity Catalog?"
    query_text: "What is Unity Catalog and how does it provide governance?"
    columns: ["chunk_id", "content", "source", "category"]
    num_results: 5
    expect_min_results: 1

  - question: "How does Delta Lake work?"
    query_text: "Delta Lake storage layer ACID transactions"
    columns: ["chunk_id", "content", "source", "category"]
    num_results: 5
    expect_min_results: 1

  - question: "Vector Search capabilities"
    query_text: "How do I create a vector search index for semantic similarity?"
    columns: ["chunk_id", "content", "source", "category"]
    num_results: 3
    expect_min_results: 1

  - question: "Machine learning on Databricks"
    query_text: "MLflow experiment tracking model serving feature store"
    columns: ["chunk_id", "content", "source", "category"]
    num_results: 5
    expect_min_results: 1

  - question: "Data ingestion options"
    query_text: "How to ingest data into Databricks from external sources?"
    columns: ["chunk_id", "content", "source", "category"]
    num_results: 5
    expect_min_results: 1
