    <path d="M1210,155 H1240 V295 H1210"/>
    <path d="M1210,225 H1268" marker-end="url(#arrow)"/>
    <path d="M1410,225 H1468" marker-end="url(#arrow)"/>
    <!-- Vector Search reads its index over the docs table -->
    <path d="M1210,365 H1468" marker-end="url(#arrow)"/>
    <!-- docs ingestion -->
    <path d="M1170,507 H1208" marker-end="url(#arrow)"/>
    <path d="M1370,507 H1565 V392" marker-end="url(#arrow)"/>
    <!-- data universe lane (right to left), then up into the prompt -->
    <path d="M1470,607 H1222" marker-end="url(#arrow)"/>
    <path d="M1040,607 H1002" marker-end="url(#arrow)"/>
    <path d="M840,607 H802" marker-end="url(#arrow)"/>
    <path d="M760,585 V392" marker-end="url(#arrow)"/>
