    <path d="M470,300 V493" marker-end="url(#arrow)"/>
    <path d="M440,300 V493" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <!-- consumers of the OTel tables -->
    <path d="M420,520 H382" marker-end="url(#arrow)"/>
    <path d="M420,582 H382" marker-end="url(#arrow)"/>
    <path d="M220,520 H192" marker-end="url(#arrow)"/>
  </g>
  <!-- emphasised: every tool call passes the allowlist -->
  <path d="M810,210 H858" fill="none" stroke="#9a6700" stroke-width="2.6" marker-end="url(#arrow)"/>

