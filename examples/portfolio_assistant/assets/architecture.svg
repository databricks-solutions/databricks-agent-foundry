  <text x="115" y="533" text-anchor="middle" font-size="10" fill="#57606a">evaluation brick</text>
  <rect x="40" y="560" width="340" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
