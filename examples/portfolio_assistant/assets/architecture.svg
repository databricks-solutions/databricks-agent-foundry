    <path d="M780,585 V570 H1130 V585" stroke-dasharray="5 3"/>
    <path d="M1005,570 V440 H1340 V371 A6,6 0 0 1 1340,359 V272" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
