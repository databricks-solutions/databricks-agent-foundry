  <rect x="880" y="581" width="200" height="34" rx="17" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="980.0" y="596" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">prod</text>
  <text x="980.0" y="609" text-anchor="middle" font-size="10" fill="#57606a">approved deploy</text>
