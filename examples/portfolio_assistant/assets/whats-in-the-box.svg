  <rect x="520" y="581" width="300" height="34" rx="17" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="670.0" y="596" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">staging</text>
