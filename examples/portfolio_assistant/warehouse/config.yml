# yaml-language-server: $schema=../../../.agent-foundry/schemas/warehouse_config.schema.json
#
# Dedicated SQL warehouse for portfolio-assistant
# ================================================
# Provisioned during deployment with billing tags so that all DBU
# consumption on this warehouse is attributable to this instance.
#
# Auto-computed fields (name, ai_solution_managed_by tag) are injected by the
# deploy script from InstanceConfig -- only instance-specific
# overrides need to appear here.

# SAFE TO CHANGE: warehouse size (affects cost and performance).
size: "X-Small"

# SAFE TO CHANGE: auto-stop idle timeout in minutes.
auto_stop_mins: 30

# SAFE TO CHANGE: multi-cluster autoscaling bounds. The warehouse
# autoscales between these values based on concurrent query load.
# Set min = max to disable autoscaling.
min_num_clusters: 1
max_num_clusters: 2
