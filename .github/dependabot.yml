# Dependabot configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Python dependencies are not updated by Dependabot: its PRs bump single
# packages without their exact-pinned siblings and without the
# lock-derived App constraints in agent_foundry/constraints/*.txt.
# Dependabot alerts stay on; fix them by hand with an override in
# pyproject.toml, `uv lock`, and `python -m agent_foundry.constraints.export`.
version: 2

updates:
  # ---------------------------------------------------------------------
  # GitHub Actions pinned in .github/workflows (ci.yml, acceptance.yml).
  # ---------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0  # off upstream; raise it in your fork
    labels:
      - "dependencies"
    groups:
      # Cap to minor/patch so major action bumps (which can change runtime
      # or workflow behaviour) are reviewed/applied manually, not auto-opened.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
