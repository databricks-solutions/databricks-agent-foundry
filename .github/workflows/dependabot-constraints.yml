name: Refresh Dependabot App constraints

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  refresh:
    # pull_request_target has a write token, so restrict it to Dependabot
    # branches in this repository. Never execute code from the PR checkout.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.repository != 'databricks-solutions/databricks-agent-foundry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # The trusted checkout sits at the workspace root so ./.github/actions
      # resolve to the default branch, never to the Dependabot branch.
      - name: Check out trusted exporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          path: update
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3


      - name: Install from lock (public PyPI)
        run: uv sync --frozen

      - name: Regenerate lock-derived App constraints
        env:
          UPDATE_ROOT: ${{ github.workspace }}/update
        run: uv run --no-sync python -m agent_foundry.constraints.export --root "$UPDATE_ROOT"

      - name: Verify exporter changed only constraint files
        working-directory: update
        shell: bash
        run: |
          unexpected="$(
            git diff --name-only |
              grep -Ev '^agent_foundry/constraints/[^/]+\.txt$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Exporter changed unexpected files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit refreshed constraints
        working-directory: update
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Constraint files are already current."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add agent_foundry/constraints/*.txt
          git commit -m "chore(deps): refresh App constraints"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:$HEAD_REF"
